services:
  demographics-service:
    build: .
    container_name: demographics_service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://healthcare:healthcare_dev@postgres:5432/patients
      KAFKA_BOOTSTRAP: kafka:9092
      SERVICE_HOST_MODE: docker
      PORT_PATIENTS_SERVICE: "8100"
      PORT_AUDIT_LOG_SERVICE: "8007"
      LOG_LEVEL: INFO
    ports:
      - "8101:8101"
    networks:
      - healthcare_net
    volumes:
      - ../../libs/py-healthcare-common:/opt/py-healthcare-common:ro
    command: >
      sh -c "pip install -e /opt/py-healthcare-common && python -m app.main"
